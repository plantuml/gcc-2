name: Hello (gcc)

# The same C (c/, generated by TeaVM 0.16.0 from src/main/java/Hello.java), built by several
# compilers and run with several sizes of the heap. See README.md.

on:
  push:
  workflow_dispatch:

jobs:

  hello:
    name: ${{ matrix.runner }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, cc: gcc }
          - { runner: ubuntu-latest, cc: gcc }
          - { runner: ubuntu-latest, cc: gcc-14 }
          - { runner: ubuntu-latest, cc: gcc-13 }
          - { runner: ubuntu-latest, cc: clang }

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Compiler
        run: |
          if [ "${{ matrix.cc }}" != "gcc" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cc }}
          fi
          grep PRETTY_NAME /etc/os-release
          ${{ matrix.cc }} --version | head -1
          ldd --version | head -1

      # The size of the heap changes the layout of the memory, and with it the way the failure
      # shows up (a segmentation fault, or a NullPointerException, or nothing): hence a sweep.
      # Only main.c is different from one size to the next.
      - name: Build and run, for several sizes of the heap
        run: |
          set +e
          failures=0
          {
            echo "### ${{ matrix.runner }} / ${{ matrix.cc }} ($(${{ matrix.cc }} --version | head -1))"
            echo
            echo "| heap | exit code | output |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for mb in default 1 2 3 4 5 6 7 8 12 16 24 32 48 64; do
            args=""
            [ "$mb" != "default" ] && args="-DHEAP_MB=$mb"
            rm -rf "build-$mb"
            CC=${{ matrix.cc }} cmake -S . -B "build-$mb" $args > /dev/null
            cmake --build "build-$mb" --parallel "$(getconf _NPROCESSORS_ONLN)" > "build-$mb.log" 2>&1 \
              || { echo "heap $mb: the build failed"; tail -5 "build-$mb.log"; failures=$((failures + 1)); continue; }
            output="$("build-$mb/bin/hello" 2>&1)"
            code=$?
            if [ $code -eq 0 ] && [ "$output" = "Hello, world! CRC32 = ebe6c6e6" ]; then
              status="ok"
            else
              status="FAILED"
              failures=$((failures + 1))
            fi
            echo "heap $mb MB: exit code $code, $status: $output"
            echo "| $mb | $code | $status: \`$output\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failures of 15 runs failed"
          [ $failures -eq 0 ]

  # What changes in the code generated by the compiler, for the two small functions that
  # fail: the constructor and update() of CRC32 (jzlib's, and TeaVM's wrapper of java.util.zip).
  assembly:
    name: assembly, gcc 15 against gcc 14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Compile to assembly with gcc and gcc-14, and compare
        run: |
          set +e
          sudo apt-get update > /dev/null
          sudo apt-get install -y gcc-14 > /dev/null
          gcc --version | head -1
          gcc-14 --version | head -1
          for f in $(find c -name CRC32.c | sort); do
            name="$(echo "$f" | tr '/' '_')"
            gcc    -std=gnu11 -O2 -w -S -o "$name.gcc15.s" "$f"
            gcc-14 -std=gnu11 -O2 -w -S -o "$name.gcc14.s" "$f"
            # no comments, no line numbers
            for v in gcc15 gcc14; do
              grep -v '^\s*\.\(file\|ident\|loc\|cfi_\|section\|size\|type\)' "$name.$v.s" > "$name.$v.txt"
            done
            echo "::group::$f: $(wc -l < "$name.gcc14.txt") lines with gcc 14, $(wc -l < "$name.gcc15.txt") with gcc 15"
            diff -u "$name.gcc14.txt" "$name.gcc15.txt" | head -400
            echo "::endgroup::"
          done

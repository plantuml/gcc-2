name: Hello (gcc)

# The same C (c/, generated by TeaVM 0.16.0 from src/main/java/Hello.java), built by several
# compilers and run with several sizes of the heap. See README.md.

on:
  push:
  workflow_dispatch:

jobs:

  hello:
    name: ${{ matrix.runner }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, cc: gcc }
          - { runner: ubuntu-latest, cc: gcc }
          - { runner: ubuntu-latest, cc: gcc-14 }
          - { runner: ubuntu-latest, cc: gcc-13 }
          - { runner: ubuntu-latest, cc: clang }

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Compiler
        run: |
          if [ "${{ matrix.cc }}" != "gcc" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.cc }}
          fi
          grep PRETTY_NAME /etc/os-release
          ${{ matrix.cc }} --version | head -1
          ldd --version | head -1

      # The size of the heap changes the layout of the memory, and with it the way the failure
      # shows up (a segmentation fault, or a NullPointerException, or nothing): hence a sweep.
      # Only main.c is different from one size to the next.
      - name: Build and run, for several sizes of the heap
        run: |
          set +e
          failures=0
          {
            echo "### ${{ matrix.runner }} / ${{ matrix.cc }} ($(${{ matrix.cc }} --version | head -1))"
            echo
            echo "| heap | exit code | output |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for mb in default 1 2 3 4 5 6 7 8 12 16 24 32 48 64; do
            args=""
            [ "$mb" != "default" ] && args="-DHEAP_MB=$mb"
            rm -rf "build-$mb"
            CC=${{ matrix.cc }} cmake -S . -B "build-$mb" $args > /dev/null
            cmake --build "build-$mb" --parallel "$(getconf _NPROCESSORS_ONLN)" > "build-$mb.log" 2>&1 \
              || { echo "heap $mb: the build failed"; tail -5 "build-$mb.log"; failures=$((failures + 1)); continue; }
            output="$("build-$mb/bin/hello" 2>&1)"
            code=$?
            if [ $code -eq 0 ] && [ "$output" = "Hello, world! CRC32 = ebe6c6e6" ]; then
              status="ok"
            else
              status="FAILED"
              failures=$((failures + 1))
            fi
            echo "heap $mb MB: exit code $code, $status: $output"
            echo "| $mb | $code | $status: \`$output\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failures of 15 runs failed"
          [ $failures -eq 0 ]

  # What changes in the code generated by the compiler, for the two small functions that
  # fail: the constructor and update() of CRC32 (jzlib's, and TeaVM's wrapper of java.util.zip).
  assembly:
    name: assembly, gcc 15 against gcc 14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Compile to assembly with gcc and gcc-14, and compare
        run: |
          set +e
          sudo apt-get update > /dev/null
          sudo apt-get install -y gcc-14 > /dev/null
          gcc --version | head -1
          gcc-14 --version | head -1
          for f in $(find c -name CRC32.c | sort); do
            name="$(echo "$f" | tr '/' '_')"
            gcc    -std=gnu11 -O2 -w -S -o "$name.gcc15.s" "$f"
            gcc-14 -std=gnu11 -O2 -w -S -o "$name.gcc14.s" "$f"
            # no comments, no line numbers
            for v in gcc15 gcc14; do
              grep -v '^\s*\.\(file\|ident\|loc\|cfi_\|section\|size\|type\)' "$name.$v.s" > "$name.$v.txt"
            done
            echo "::group::$f: $(wc -l < "$name.gcc14.txt") lines with gcc 14, $(wc -l < "$name.gcc15.txt") with gcc 15"
            diff -u "$name.gcc14.txt" "$name.gcc15.txt" | head -400
            echo "::endgroup::"
          done

  # Which optimization of gcc 15 is responsible? Each line adds one flag to -O2; a flag that turns
  # the failures into successes points to the pass that drops the code after allocateArray().
  flags:
    name: gcc 15 with ${{ matrix.flags }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "-O2"
          - "-O2 -fno-ipa-pure-const"
          - "-O2 -fno-ipa-modref"
          - "-O2 -fno-ipa-ra"
          - "-O2 -fno-ipa-icf"
          - "-O2 -fno-ipa-cp"
          - "-O2 -fno-ipa-sra"
          - "-O2 -fno-inline"
          - "-O2 -fno-optimize-sibling-calls"
          - "-O2 -fno-isolate-erroneous-paths-dereference"
          - "-O2 -fno-tree-dce"
          - "-O1"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Build and run, for several sizes of the heap
        run: |
          set +e
          gcc --version | head -1
          failures=0
          for mb in default 1 2 4 8 16 32 64; do
            args=""
            [ "$mb" != "default" ] && args="-DHEAP_MB=$mb"
            rm -rf "build-$mb"
            cmake -S . -B "build-$mb" $args -DOPT_FLAGS="${{ matrix.flags }}" > /dev/null
            cmake --build "build-$mb" --parallel "$(getconf _NPROCESSORS_ONLN)" > "build-$mb.log" 2>&1 \
              || { echo "heap $mb: the build failed"; tail -5 "build-$mb.log"; failures=$((failures + 1)); continue; }
            output="$("build-$mb/bin/hello" 2>&1)"
            if [ $? -eq 0 ] && [ "$output" = "Hello, world! CRC32 = ebe6c6e6" ]; then
              echo "heap $mb MB: ok"
            else
              echo "heap $mb MB: FAILED: $output"
              failures=$((failures + 1))
            fi
          done
          echo "| ${{ matrix.flags }} | $failures of 8 failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "$failures of 8 runs failed"
          # red when something fails: the result is then visible in the list of jobs
          [ $failures -eq 0 ]

  # What does gcc 15 conclude about allocateArray()? Its dump of the interprocedural analysis says
  # whether it believes that the function (or one it calls) never returns.
  noreturn:
    name: what gcc 15 infers about allocateArray
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Dump of pure-const
        run: |
          set +e
          gcc --version | head -1
          mkdir dump && cd dump
          for f in c/o/t/r/Allocator.c c/o/t/r/GC.c c/o/t/r/ExceptionHandling.c; do
            gcc -std=gnu11 -O2 -w -c -fdump-ipa-pure-const -fdump-ipa-inline "../c/$f" -o /dev/null -dumpdir ./ 2>&1 | head -5
          done
          ls
          grep -h -B1 -A3 -i "noreturn\|does not return\|looping\|nothrow" *pure-const* | head -300
          echo "--- teavm_outOfMemory and teavm_gc_allocate:"
          grep -rn "teavm_outOfMemory\|teavm_gc_allocate" ../c --include=*.h | head

  # The smallest set of files, then of functions, that must be optimized for the failure.
  bisect:
    name: bisect (delta debugging)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Find the functions
        run: |
          gcc --version | head -1
          python3 tools/bisect.py 2>&1 | tee bisect.log
          { echo '```'; tail -150 bisect.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Which pass of gcc 15 removes the code that follows the call to allocateArray() in the clinit of
  # CRC32? The count of the lines that store the table, pass after pass, shows where it changes.
  passes:
    name: gcc 15, pass by pass
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Dumps of the passes, warnings
        run: |
          set +e
          gcc --version | head -1
          mkdir dump
          gcc -std=gnu11 -O2 -c c/c/c/j/j/CRC32.c -o dump/crc32.o -fdump-tree-all -fdump-ipa-all \
              -fdump-rtl-all -dumpdir dump/ \
              -Wall -Wextra -Warray-bounds=2 -Wstringop-overflow=4 -Wnull-dereference -Wunreachable-code 2>&1 \
              | grep -v "unused" | head -80
          echo "::group::passes, in order: lines mentioning the store of the table in the clinit"
          # number of lines of the function in each dump (a sudden drop = the pass that removed code)
          for f in $(ls dump | grep -E '\.[0-9]+t\.' | sort -t. -k2 -n); do
            n=$(awk '/^;; Function /{on=($3 ~ /meth_cjj_CRC32__clinit_/)} on' "dump/$f" | wc -l)
            echo "$n $f"
          done | awk '$1 > 0 { if ($1 != prev) print; prev = $1 }'
          echo "::endgroup::"
          echo "::group::dump just before and after the first change"
          ls dump | grep -E '\.[0-9]+[tir]\.' | sort -t. -k2 -n | head -400 > dump/order.txt
          echo "::endgroup::"
          echo "::group::final tree of the clinit"
          cat dump/*.optimized | awk '/meth_cjj_CRC32__clinit_ \(/{on=1} on' | head -120
          echo "::endgroup::"

  # Which of the options that -O2 adds to -O1 breaks the clinit of CRC32? (-O1 works.)
  scan:
    name: scan of the options of -O2
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Turn off the options one by one
        run: |
          gcc --version | head -1
          python3 tools/scan_flags.py 2>&1 | tee scan.log
          { echo '```'; cat scan.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The suspect: the pass "crc" that GCC 15 added (-foptimize-crc) recognizes the loop that fills a
  # CRC table. Does a minimal C file show the bug? The check: __builtin_unreachable() in the final tree.
  repro:
    name: minimal cases with gcc 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Compile, with and without -foptimize-crc
        run: |
          set +e
          gcc --version | head -1
          for f in repro/*.c; do
            for opt in "-O2" "-O2 -fno-optimize-crc" "-O2 -fno-tree-vrp" "-O1"; do
              rm -rf out; mkdir out
              gcc -std=gnu11 $opt -c "$f" -o out/x.o -fdump-tree-optimized -dumpdir out/ -w
              n=$(cat out/*optimized 2>/dev/null | grep -c "__builtin_unreachable")
              lines=$(objdump -d out/x.o | grep -c "ret")
              size=$(cat out/*optimized 2>/dev/null | wc -l)
              echo "$f  [$opt]  lines of the final tree: $size; __builtin_unreachable: $n; ret in the code: $lines"
              echo "| $f | $opt | $size | $n | $lines |" >> "$GITHUB_STEP_SUMMARY.tmp"
            done
          done
          { echo "| file | options | lines of the final tree | __builtin_unreachable | ret |"; echo "|---|---|---|---|---|"; cat "$GITHUB_STEP_SUMMARY.tmp"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::crc_v4 to crc_v6 are included in the loop above"
          echo "::endgroup::"
          echo "::group::final tree of crc_v1.c with -O2"
          gcc -std=gnu11 -O2 -c repro/crc_v1.c -o /dev/null -fdump-tree-optimized-blocks -dumpdir ./ -w; cat crc_v1.c.*optimized* 2>/dev/null
          echo "::endgroup::"

          echo "::group::dump of the pass crc for crc_v3.c (gcc 15)"
          gcc -std=gnu11 -O2 -c repro/crc_v3.c -o /dev/null -fdump-tree-crc-details -fdump-tree-optimized -dumpdir ./ -w
          ls *.crc* 2>/dev/null; cat *.crc 2>/dev/null | head -150
          echo "::endgroup::"
          echo "::group::final tree of crc_v3.c with -O2"
          cat crc_v3.c.*optimized 2>/dev/null | tail -60
          echo "::endgroup::"

          echo "::group::run-time check (PR 127984 and ours)"
          for opt in "-O0" "-O2" "-O2 -fno-optimize-crc" "-O2 -fno-tree-vrp" "-O3"; do
            gcc -std=gnu11 $opt repro-run/check.c -o check && ./check | sed "s/^/[$opt] /"
          done
          echo "::endgroup::"
